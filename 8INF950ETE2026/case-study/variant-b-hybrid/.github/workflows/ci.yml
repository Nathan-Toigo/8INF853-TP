name: CI - Variante B (hybride)

on:
  push:
    paths:
      - "case-study/variant-b-hybrid/**"
  pull_request:
    paths:
      - "case-study/variant-b-hybrid/**"

defaults:
  run:
    working-directory: case-study/variant-b-hybrid

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests + couverture (minimum 80%)
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

      - name: Audit des dépendances (vulnérabilités connues)
        run: pip-audit -r requirements.txt

      - name: Conserver le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: case-study/variant-b-hybrid/coverage.xml
