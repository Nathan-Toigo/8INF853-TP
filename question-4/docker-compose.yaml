services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  customers:
    build: ./services/customers
    image: banqueexpress/customers:latest
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/customers_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3001:3001'

  accounts:
    build: ./services/accounts
    image: banqueexpress/accounts:latest
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@db:5432/accounts_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3002:3002'

  transactions:
    build: ./services/transactions
    image: banqueexpress/transactions:latest
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@db:5432/transactions_db
      ACCOUNTS_SERVICE_URL: http://accounts:3002
    depends_on:
      db:
        condition: service_healthy
      accounts:
        condition: service_started
    ports:
      - '3003:3003'

  gateway:
    build: ./services/gateway
    image: banqueexpress/gateway:latest
    environment:
      PORT: 3000
      CUSTOMERS_SERVICE_URL: http://customers:3001
      ACCOUNTS_SERVICE_URL: http://accounts:3002
      TRANSACTIONS_SERVICE_URL: http://transactions:3003
    depends_on:
      - customers
      - accounts
      - transactions
    ports:
      - '3000:3000'

volumes:
  db_data:

networks:
  default:
    driver: bridge
